<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Our Journey</title>
  <meta name="description" content="Bản đồ chữ S của hai đứa: check-in một chạm, nhật ký theo lịch, album ảnh và dùng chung.">
  <meta name="theme-color" content="#FBE6EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Our Journey">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Màn hình khoá -->
  <div class="lock" id="lock" role="dialog" aria-label="Nhập mã để vào">
    <div class="lk-in">
      <img class="lk-logo" src="icons/icon.svg" alt="">
      <p class="lk-title">Our Journey</p>
      <p class="lk-msg">Nhập mã để vào</p>
      <div class="lk-dots"><i></i><i></i><i></i><i></i></div>
      <div class="lk-pad">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <span></span><button type="button" data-k="0">0</button><button type="button" data-k="del" class="lk-del" aria-label="Xoá">⌫</button>
      </div>
    </div>
  </div>
  <script src="js/lock.js"></script>

  <div id="app">
    <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

    <!-- ============ BẢN ĐỒ: ở đâu ============ -->
    <section class="view view-map is-active" id="view-map" data-view="map">
      <div id="map" aria-label="Bản đồ"></div>

      <div class="map-top">
        <form class="glass search" id="searchForm" role="search">
          <span class="ico" data-icon="search"></span>
          <input id="searchInput" type="search" placeholder="Tìm địa điểm, quán ăn…" autocomplete="off" enterkeyhint="search">
          <button type="button" class="search-clear" id="searchClear" hidden aria-label="Xoá tìm kiếm"><span data-icon="x"></span></button>
        </form>
        <ul class="glass search-results" id="searchResults" hidden></ul>
        <div class="chips map-filters" id="mapFilters" hidden></div>
        <div class="glass focus-banner" id="focusBanner" hidden>
          <span data-icon="route"></span>
          <span class="focus-title" id="focusTitle"></span>
          <button type="button" class="chip-btn" id="focusClose">Đóng</button>
        </div>
        <div class="glass focus-banner" id="replayBar" hidden>
          <span data-icon="play"></span>
          <span class="focus-title" id="replayTitle"></span>
          <button type="button" class="chip-btn" id="replayStop">Dừng</button>
        </div>
      </div>

      <div class="map-tools">
        <button type="button" class="glass round-btn" id="btnHome" aria-label="Về bản đồ chữ S" title="Bản đồ chữ S"><span data-icon="vn"></span></button>
        <button type="button" class="glass round-btn" id="btnLocate" aria-label="Về vị trí của tôi" title="Vị trí của tôi"><span data-icon="locate"></span></button>
        <button type="button" class="glass round-btn" id="btnLayers" aria-label="Tuỳ chọn bản đồ" title="Tuỳ chọn bản đồ"><span data-icon="layers"></span></button>
        <div class="glass layer-menu" id="layerMenu" hidden></div>
      </div>

      <div class="pick-cross" id="pickCross" hidden><span></span></div>

      <div class="map-bottom">
        <p class="attrib" id="attrib"></p>
        <div class="glass rec-bar" id="recBar" hidden></div>
        <div class="glass rec-bar trip-bar" id="tripBar" hidden></div>
        <div class="glass scope-card" id="scopeCard"></div>
        <div class="glass pick-bar" id="pickBar" hidden>
          <p>Kéo bản đồ để đặt ghim vào đúng chỗ</p>
          <div class="row">
            <button type="button" class="btn ghost" id="pickCancel">Huỷ</button>
            <button type="button" class="btn primary" id="pickOk">Chọn vị trí này</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CUNG ĐƯỜNG: mỗi chuyến đi ============ -->
    <section class="view page" id="view-trips" data-view="trips">
      <header class="page-head">
        <div class="head-row"><h1>Cung đường</h1></div>
      </header>
      <div class="page-body" id="tripsBody"></div>
    </section>

    <!-- ============ NHẬT KÝ: khi nào (lịch + album ảnh) ============ -->
    <section class="view page" id="view-diary" data-view="diary">
      <header class="page-head">
        <div class="head-row">
          <h1>Tụi mình</h1>
          <button type="button" class="icon-btn" data-act="settings" aria-label="Cài đặt" title="Cài đặt"><span data-icon="gear"></span></button>
        </div>
        <div class="seg us-seg" role="tablist" aria-label="Kiểu xem">
          <button type="button" class="is-on" data-diarymode="us">Hành trình</button>
          <button type="button" data-diarymode="cal">Lịch</button>
          <button type="button" data-diarymode="album">Ảnh</button>
        </div>
      </header>
      <div class="page-body">
        <div class="diary-list" id="usBox"></div>
        <div class="card cal" id="calBox" hidden></div>
        <div class="diary-list" id="diaryList" hidden></div>
        <div class="diary-list" id="albumBox" hidden>
          <div class="seg" role="tablist" aria-label="Xếp ảnh theo">
            <button type="button" class="is-on" data-albummode="month">Theo tháng</button>
            <button type="button" data-albummode="place">Theo nơi</button>
          </div>
          <div class="diary-list" id="albumBody"></div>
        </div>
      </div>
    </section>

    <!-- ============ THANH TAB ============ -->
    <nav class="glass tabbar" aria-label="Điều hướng">
      <button type="button" class="tab is-on" data-go="map"><span data-icon="map"></span><b>Bản đồ</b></button>
      <button type="button" class="tab" data-go="trips"><span data-icon="route"></span><b>Cung đường</b></button>
      <button type="button" class="tab" data-go="diary"><span data-icon="heart"></span><b>Tụi mình</b></button>
    </nav>
    <button type="button" class="fab-float" id="btnAdd" aria-label="Check-in: ghim ngay chỗ đang đứng"><span data-icon="pinplus"></span><b>Check-in</b></button>

    <!-- Thẻ check-in nhanh -->
    <div class="glass quick-card" id="quickCard" hidden></div>
    <input type="file" id="quickFile" accept="image/*" multiple hidden>

    <!-- Bottom sheet dùng chung -->
    <div class="scrim" id="scrim" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
      <div class="sheet-grip"></div>
      <div class="sheet-inner" id="sheetInner"></div>
      <div class="sheet-foot" id="sheetFoot" hidden></div>
    </div>

    <!-- Hộp xác nhận -->
    <div class="modal" id="modal" hidden>
      <div class="modal-card">
        <h3 id="modalTitle"></h3>
        <p id="modalText"></p>
        <div class="row">
          <button type="button" class="btn ghost" id="modalNo">Huỷ</button>
          <button type="button" class="btn danger" id="modalYes">Đồng ý</button>
        </div>
      </div>
    </div>

    <!-- Xem ảnh -->
    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="lb-close" id="lbClose" aria-label="Đóng"><span data-icon="x"></span></button>
      <div class="lb-track" id="lbTrack"></div>
      <button type="button" class="lb-cap" id="lbCap"></button>
    </div>

    <!-- Story tổng kết -->
    <div class="story" id="story" hidden>
      <div class="story-bars" id="storyBars"></div>
      <div class="story-stage" id="storyStage">
        <canvas id="storyCanvas" width="1080" height="1920"></canvas>
        <div class="story-nav" id="storyNav"><button type="button" id="storyPrev" aria-label="Thẻ trước"></button><button type="button" id="storyNext" aria-label="Thẻ sau"></button></div>
      </div>
      <button type="button" class="story-close" id="storyClose" aria-label="Đóng"><span data-icon="x"></span></button>
      <div class="story-acts">
        <button type="button" class="btn line" id="storyShare"><span data-icon="image"></span>Lưu ảnh</button>
        <button type="button" class="btn primary" id="storyVideo"><span data-icon="play"></span>Quay video</button>
      </div>
      <div class="story-rec" id="storyRec"><i></i>Đang quay video · <span id="storyRecTime">0 giây</span></div>
      <div class="story-save" id="storySave" hidden>
        <div class="ss-media"></div>
        <p></p>
        <div class="ss-acts">
          <button type="button" class="btn primary" id="storySaveShare"><span data-icon="upload"></span>Chia sẻ</button>
          <a class="btn line" id="storySaveDl" href="#" download><span data-icon="download"></span>Tải về</a>
          <button type="button" class="btn line" id="storySaveClose">Xong</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
    <datalist id="vnUnits"></datalist>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/vn-shape.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/story.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
